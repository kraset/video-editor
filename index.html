<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Video Editor</title>
  </head>
  <body>
    <!-- FFMPEG path configuration bar -->
    <div id="ffmpeg-bar">
      <label for="ffmpeg-path-input">FFMPEG file path:</label>
      <input type="text" id="ffmpeg-path-input" spellcheck="false" readonly />
      <button id="ffmpeg-browse-btn">Browse…</button>
      <span id="ffmpeg-status"></span>
      <span id="ffmpeg-warning">
        You have to enter and save the path to your FFMPEG file.
      </span>
    </div>

    <!-- Shown when no video is loaded -->
    <div id="drop-zone">
      <div id="drop-zone-inner">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="48"
          height="48"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
        <p>Drag &amp; drop a video file here</p>
        <button id="pick-file-btn">Pick a file</button>
      </div>
    </div>

    <!-- Shown when a video is loaded -->
    <div id="player-wrapper" hidden>
      <div id="video-container">
        <div id="video-wrapper">
          <video id="video"></video>
          <canvas id="crop-canvas"></canvas>
        </div>
        <div id="controls">
          <button id="play-pause-btn" aria-label="Play">&#9654;</button>
          <input
            type="range"
            id="progress"
            min="0"
            max="100"
            value="0"
            step="0.01"
          />
        </div>
      </div>
    </div>

    <!-- Action checkboxes (shown when a video is loaded) -->
    <div id="actions" hidden>
      <label class="action-check">
        <input type="checkbox" id="chk-trim" /> Trim
      </label>
      <label class="action-check">
        <input type="checkbox" id="chk-crop" /> Crop
      </label>
      <label class="action-check">
        <input type="checkbox" id="chk-downsample" /> Downsample
      </label>
      <label class="action-check">
        <input type="checkbox" id="chk-downscale" /> Downscale
      </label>
      <label class="action-check">
        <input type="checkbox" id="chk-compress" /> Compress
      </label>
      <label class="action-check">
        <input type="checkbox" id="chk-audio-remove" /> Remove Audio
      </label>
      <label class="action-check">
        <input type="checkbox" id="chk-audio-map" /> Replace Audio
      </label>
      <label class="action-check">
        <input type="checkbox" id="chk-convert" /> Convert to MP4
      </label>
    </div>

    <!-- Trim config -->
    <div id="config-section" hidden>
      <button class="action-btn" id="btn-set-start">Set Start</button>
      <span class="time-label" id="label-start">--:--:--</span>
      <button class="action-btn" id="btn-set-end">Set End</button>
      <span class="time-label" id="label-end">--:--:--</span>
    </div>

    <!-- Crop config -->
    <div id="config-section-crop" hidden>
      <div id="crop-coord-display">
        Define crop area: top-left (0, 0) &rarr; bottom-right (0, 0)
      </div>
      <p class="crop-instruction">
        Click top-left corner, then bottom-right corner on the video.
      </p>
      <div class="crop-buttons">
        <button class="action-btn" id="btn-reset-area">Reset Area</button>
      </div>
    </div>

    <!-- Downsample config -->
    <div id="config-section-downsample" hidden>
      <label class="config-label" for="input-nth-frame"
        >Take Every Nth frame</label
      >
      <input
        class="config-number"
        type="number"
        id="input-nth-frame"
        value="2"
        min="1"
        max="60"
      />
    </div>

    <!-- Downscale config -->
    <div id="config-section-downscale" hidden>
      <label class="config-label" for="input-scale-width"
        >Scale Width (height auto)</label
      >
      <input
        class="config-number"
        type="number"
        id="input-scale-width"
        value="1280"
        min="1"
      />
    </div>

    <!-- Compress config -->
    <div id="config-section-compress" hidden>
      <label class="config-label" for="input-crf"
        >Compression CRF (lower = better quality)</label
      >
      <input
        class="config-number"
        type="number"
        id="input-crf"
        value="23"
        min="0"
        max="51"
      />
    </div>

    <!-- Replace-audio config -->
    <div id="config-section-audio-map" hidden>
      <button class="action-btn" id="btn-pick-audio">Choose Audio File…</button>
      <span class="time-label" id="audio-file-label">No file selected</span>
    </div>

    <!-- Run controls -->
    <div id="run-controls" hidden>
      <button class="action-btn cancel" id="btn-clear-all">Clear All</button>
      <button class="action-btn execute" id="btn-execute" disabled>
        Execute Action(s)
      </button>
    </div>

    <!-- Status (shown whenever media is loaded) -->
    <div id="status-section" hidden>
      <span id="status-text"></span>
    </div>

    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
