<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Video Editor</title>
  </head>
  <body>
    <!-- Shown when no video is loaded -->
    <div id="drop-zone">
      <div id="drop-zone-inner">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="48"
          height="48"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
        <p>Drag &amp; drop a video file here</p>
        <button id="pick-file-btn">Pick a file</button>
      </div>
    </div>

    <!-- Shown when a video is loaded -->
    <div id="player-wrapper" hidden>
      <div id="video-container">
        <div id="video-wrapper">
          <video id="video"></video>
          <canvas id="crop-canvas"></canvas>
        </div>
        <div id="controls">
          <button id="play-pause-btn" aria-label="Play">&#9654;</button>
          <input
            type="range"
            id="progress"
            min="0"
            max="100"
            value="0"
            step="0.01"
          />
        </div>
      </div>
    </div>

    <!-- Action buttons (ReadyForAction state) -->
    <div id="actions" hidden>
      <button class="action-btn" id="btn-trim">Trim</button>
      <button class="action-btn" id="btn-downsample">Downsample</button>
      <button class="action-btn" id="btn-crop">Crop</button>
      <button class="action-btn" id="btn-convert">Convert Format</button>
    </div>

    <!-- Trim config (Trim state) -->
    <div id="config-section" hidden>
      <button class="action-btn" id="btn-set-start">Set Start</button>
      <span class="time-label" id="label-start">--:--:--</span>
      <button class="action-btn" id="btn-set-end">Set End</button>
      <span class="time-label" id="label-end">--:--:--</span>
      <button class="action-btn execute" id="btn-execute-trim" hidden>
        Execute Trim!
      </button>
      <button class="action-btn cancel" id="btn-cancel-trim">Cancel</button>
    </div>

    <!-- Downsample config (Downsample state) -->
    <div id="config-section-downsample" hidden>
      <label class="config-label" for="input-nth-frame"
        >Take Every Nth frame</label
      >
      <input
        class="config-number"
        type="number"
        id="input-nth-frame"
        value="2"
        min="1"
        max="10"
      />
      <button class="action-btn execute" id="btn-execute-downsample">
        Execute Downsample!
      </button>
      <button class="action-btn cancel" id="btn-cancel-downsample">
        Cancel
      </button>
    </div>

    <!-- Crop config (Crop state) -->
    <div id="config-section-crop" hidden>
      <div id="crop-coord-display">
        Define crop area: top-left (0, 0) &rarr; bottom-right (0, 0)
      </div>
      <p class="crop-instruction">
        Click top-left corner, then bottom-right corner on the video.
      </p>
      <div class="crop-buttons">
        <button class="action-btn" id="btn-reset-area">Reset Area</button>
        <button class="action-btn execute" id="btn-execute-crop" disabled>
          Execute Crop!
        </button>
        <button class="action-btn cancel" id="btn-cancel-crop">Cancel</button>
      </div>
    </div>

    <!-- Convert Format config (Convert state) -->
    <div id="config-section-convert" hidden>
      <label class="config-label" for="input-src-format">Source Format</label>
      <input
        class="config-text"
        type="text"
        id="input-src-format"
        value="webm"
      />
      <label class="config-label" for="input-dest-format">Dest Format</label>
      <input
        class="config-text"
        type="text"
        id="input-dest-format"
        value="mp4"
      />
      <button class="action-btn execute" id="btn-execute-convert">
        Execute Convert!
      </button>
      <button class="action-btn cancel" id="btn-cancel-convert">Cancel</button>
    </div>

    <!-- Status (shown whenever media is loaded) -->
    <div id="status-section" hidden>
      <span id="status-text"></span>
    </div>

    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
